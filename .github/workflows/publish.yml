name: Publish to NPM

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v3.0.0)'
        required: true
        type: string

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for NPM provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # A tag da release e a versao do package.json precisam concordar ANTES de
      # qualquer coisa cara rodar. Ate 2026-09-03 este passo so LIA a versao para
      # uma saida -- publicar a release `v6.0.0` com o package.json em `5.2.0`
      # passaria por aqui sem reclamar. O `npm publish` acabaria falhando por
      # versao ja publicada, mas por acidente, e depois de todo o build.
      #
      # Vale para os dois gatilhos: `release: created` traz a tag em
      # `github.event.release.tag_name`; `workflow_dispatch` traz em `inputs.tag`.
      - name: Check tag matches package.json version
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          TAG_VERSION="${TAG#v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 package.json: $VERSION"
          echo "🏷️  tag:          $TAG (versao: $TAG_VERSION)"

          if [ -z "$TAG" ]; then
            echo "❌ Nao foi possivel resolver a tag desta publicacao."
            exit 1
          fi

          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo ""
            echo "❌ A tag e a versao do package.json nao concordam."
            echo "   tag:          $TAG        (versao $TAG_VERSION)"
            echo "   package.json: $VERSION"
            echo ""
            echo "   Publicar assim mandaria $VERSION para o npm sob o nome de $TAG_VERSION."
            echo "   Ajuste o package.json e refaca a tag, ou crie a release com a tag certa."
            exit 1
          fi

          echo "✅ tag e package.json concordam em $VERSION"

      - name: Install dependencies
        run: npm ci

      # Sem NFE_API_KEY a suite de integracao PULA (guard em
      # tests/integration/setup.ts) e a unitaria passa: 41 passed | 4 skipped,
      # exit 0. Falha aqui e falha de verdade, e barra a publicacao.
      - name: Run tests
        run: npm test -- --run
        env:
          NFE_API_KEY: ""

      - name: Run linter
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      # Guards de alinhamento de contrato (tests/types/*.test-d.ts). Existem para
      # quebrar quando um contrato pinado muda; sem este passo, nunca executam.
      - name: Run type-level tests
        run: npm run test:types

      - name: Build package
        run: npm run build

      - name: Verify build artifacts
        run: |
          echo "🔍 Verifying build artifacts..."
          test -f dist/index.js && echo "✅ dist/index.js" || (echo "❌ ESM build missing" && exit 1)
          test -f dist/index.cjs && echo "✅ dist/index.cjs" || (echo "❌ CJS build missing" && exit 1)
          test -f dist/index.d.ts && echo "✅ dist/index.d.ts" || (echo "❌ Types missing" && exit 1)
          echo ""
          echo "✅ All build artifacts present"

      - name: Publish to NPM (dry-run)
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release Summary
        run: |
          echo "### 🎉 Published to NPM" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** nfe-io@${{ steps.package-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**NPM:** https://www.npmjs.com/package/nfe-io/v/${{ steps.package-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Install:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "npm install nfe-io@${{ steps.package-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Comment on related issues/PRs
        if: github.event_name == 'release'
        uses: actions/github-script@v9
        with:
          script: |
            const version = '${{ steps.package-version.outputs.version }}';
            const releaseUrl = context.payload.release.html_url;

            const comment = `🎉 This has been released in [nfe-io@${version}](https://www.npmjs.com/package/nfe-io/v/${version})!

            Release notes: ${releaseUrl}

            Install:
            \`\`\`bash
            npm install nfe-io@${version}
            \`\`\`
            `;

            // Add comment logic here if needed
            console.log('Release published:', version);
